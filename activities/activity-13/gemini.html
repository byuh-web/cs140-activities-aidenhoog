<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike | Just Do It</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <svg height="60" width="60" viewBox="0 0 24 24"><path d="M21 12l-18 5 4-4-4-4 18 3z"/></svg>
        </div>
        <ul class="nav-links">
            <li><a href="#">New & Featured</a></li>
            <li><a href="#">Men</a></li>
            <li><a href="#">Women</a></li>
            <li><a href="#">Kids</a></li>
            <li><a href="#">Sale</a></li>
        </ul>
        <div class="nav-icons">
            <span>Search</span>
            <span>Cart (0)</span>
        </div>
    </nav>

    <header class="hero">
        <div class="hero-content">
            <p>New Arrival</p>
            <h1>NIKE AIR MAX</h1>
            <p>Extreme comfort. Revolutionary style.</p>
            <button class="btn-black">Shop Now</button>
        </div>
    </header>

    <section class="featured">
        <h2>Featured Styles</h2>
        <div class="product-grid">
            <div class="product-card">
                <div class="img-placeholder"></div>
                <h3>Air Force 1</h3>
                <p>Men's Shoes</p>
            </div>
            <div class="product-card">
                <div class="img-placeholder"></div>
                <h3>Dunk Low</h3>
                <p>Women's Shoes</p>
            </div>
            <div class="product-card">
                <div class="img-placeholder"></div>
                <h3>Metcon 9</h3>
                <p>Training Shoes</p>
            </div>
        </div>
    </section>

</body>
</html>
