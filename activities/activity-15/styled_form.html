<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Styled Form</h1>
        <p>Enter your info so I can sell it online</p>
    </header>

    <main>
        <form action="#" method="GET">
            <fieldset>
                <legend>Personal Info</legend>
                
                <div class="form-row">
                    <label for="first_name">First Name:</label>
                    <input type="text" id="first_name" name="first_name" placeholder="Enter your first name">
                </div>

                <div class="form-row">
                    <label for="last_name">Last Name:</label>
                    <input type="text" id="last_name" name="last_name" placeholder="Enter your last name">
                </div>

                <div class="form-row">
                    <label for="userEmail">Email Address:</label>
                    <input type="email" id="userEmail" name="userEmail" placeholder="67@gmail.com">
                </div>

                <div class="form-row">
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob">
                </div>

                <div class="form-row">
                    <label for="country">Country:</label>
                    <select id="country" name="country">
                        <option value="">-- Select a Country --</option>
                        <option value="us">United States</option>
                        <option value="uk">United Kingdom</option>
                        <option value="ca">Canada</option>
                        <option value="au">Australia</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <div class="form-row">
                    <label>Gender</label>
                    <div class="radio-group">
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male" class="inline-label">Male</label>

                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female" class="inline-label">Female</label>

                        <input type="radio" id="other" name="gender" value="other">
                        <label for="other" class="inline-label">Other</label>
                    </div>
                </div>

                <div class="form-row">
                    <label for="bio">Short Bio:</label>
                    <textarea id="bio" name="bio" rows="4" placeholder="Idk give stuff like your mother's maiden name and like password hints for other sites"></textarea>
                </div>

            </fieldset>

            <fieldset>
                <legend>Agreement</legend>
                <div class="form-row checkbox-row">
                    <input type="checkbox" id="terms" name="terms">
                    <label for="terms" class="inline-label">I agree to have my info sold for profit</label>
                </div>
            </fieldset>

            <div class="submit-row">
                <button type="submit" class="submit">Submit</button>
            </div>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Aiden Hoogestraat</p>
    </footer>

</body>
</html>
